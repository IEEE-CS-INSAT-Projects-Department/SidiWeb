<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Sidi Web AI - Continue building with our powerful AI platform">
    <title>Login - Sidi Web AI</title>
    <link rel="stylesheet" href="../../shared/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="topbar">
        <div class="topbar-inner">
            <a href="#" class="logo">
                <svg class="logo-icon" width="60" height="50" viewBox="0 0 60 50">
                    <text x="5" y="40" font-size="38" fill="white" font-family="serif" font-weight="bold"
                        direction="rtl">واب</text>
                    <circle cx="42" cy="8" r="10" fill="#8b1a1a" />
                    <text x="35" y="13" font-size="10" fill="white" font-family="serif">سيدي</text>
                </svg>
            </a>
            <div class="menu">
                <a href="#">How it Works</a>
                <a href="#">Features</a>
                <a href="#">Showcase</a>
            </div>
            <a href="login.html" class="login-btn">Login</a>
        </div>
    </nav>

    <main class="page">
        <div class="card">
            <h1 class="heading">Welcome back</h1>
            <p class="subtext">Sign in to continue building with Sidi Web</p>

            <div class="socials">
                <button class="social" id="google-login-btn">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" width="22" height="22">
                            <path
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                                fill="#4285F4" />
                            <path
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                fill="#34A853" />
                            <path
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                fill="#FBBC05" />
                            <path
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                fill="#EA4335" />
                        </svg>
                    </div>
                    <span>Continue with Google</span>
                </button>
                <button class="social" id="facebook-login-btn">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" width="22" height="22">
                            <circle cx="12" cy="12" r="11" fill="#1877F2" />
                            <path
                                d="M16.67 15.13l.55-3.58h-3.44v-2.32c0-.98.48-1.94 2.02-1.94h1.57V4.16s-1.42-.24-2.78-.24c-2.84 0-4.69 1.72-4.69 4.83v2.73H7v3.58h2.89v8.64C10.56 23.9 11.27 24 12 24s1.44-.1 2.11-.3v-8.64h2.56z"
                                fill="white" />
                        </svg>
                    </div>
                    <span>Continue with Facebook</span>
                </button>
            </div>

            <div class="divider">
                <span>OR</span>
            </div>

            <form class="form" id="login-form">
                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="example@gmail.com" autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-box">
                        <input type="password" id="password" placeholder="@#*%" autocomplete="current-password">
                        <button type="button" class="eye-toggle" id="toggle-password"
                            aria-label="Toggle password visibility">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="options">
                    <label class="checkbox" for="remember-me">
                        <input type="checkbox" id="remember-me">
                        <span class="tick"></span>
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot">Forgot Password?</a>
                </div>
                <button type="submit" class="button" id="login-submit-btn">Login</button>
            </form>

            <p class="switch">Don't have an account? <a href="signup.html">Create now</a></p>
        </div>
    </main>

    <footer class="bottom">
        <div class="bottom-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="#">Help Center</a>
        </div>
        <p class="copyright">&copy; 2026 Sidi Web AI. All rights reserved.</p>
    </footer>

    <script type="module" src="auth.js"></script>
</body>

</html>
